<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Recommendation - AgriTech</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>AgriTech AI</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span>📊 Dashboard</span></a>
                <a href="crop-recommendation.html" class="active"><span>🌱 Crop Advisory</span></a>
                <a href="#"><span>🧪 Fertilizer</span></a>
                <a href="#"><span>💧 Irrigation</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="navbar">
                <div class="nav-title" style="font-weight: 600; font-size: 1.2rem;">AI Crop Recommendation Engine</div>
            </header>

            <div class="page-content animate-fade-in">
                
                <div class="form-card mb-2">
                    <h2 class="mb-1" style="color: var(--primary-dark);">Enter Field Data</h2>
                    <p class="mb-2" style="color: var(--text-muted); font-size: 0.95rem;">Provide accurate soil and weather information to get the best crop match from our rule-based scoring engine.</p>
                    
                    <form id="cropRecommendationForm">
                        <div class="form-row">
                            <!-- Weather -->
                            <div class="form-group">
                                <label for="temp">Temperature (°C)</label>
                                <input type="number" id="temp" class="form-control" placeholder="e.g. 28" required>
                            </div>
                            <div class="form-group">
                                <label for="humidity">Humidity (%)</label>
                                <input type="number" id="humidity" class="form-control" placeholder="e.g. 70" required>
                            </div>
                            <div class="form-group">
                                <label for="rainfall">Rainfall (mm)</label>
                                <input type="number" id="rainfall" class="form-control" placeholder="e.g. 200" required>
                            </div>

                            <!-- Soil Health -->
                            <div class="form-group">
                                <label for="ph">Soil pH (0-14)</label>
                                <input type="number" step="0.1" id="ph" class="form-control" placeholder="e.g. 6.5" required>
                            </div>
                            <div class="form-group">
                                <label for="n">Nitrogen (N)</label>
                                <input type="number" id="n" class="form-control" placeholder="e.g. 100" required>
                            </div>
                            <div class="form-group">
                                <label for="p">Phosphorus (P)</label>
                                <input type="number" id="p" class="form-control" placeholder="e.g. 50" required>
                            </div>
                            <div class="form-group">
                                <label for="k">Potassium (K)</label>
                                <input type="number" id="k" class="form-control" placeholder="e.g. 40" required>
                            </div>
                            <div class="form-group">
                                <label for="soilType">Soil Type</label>
                                <select id="soilType" class="form-control" required>
                                    <option value="">Select Soil Type...</option>
                                    <option value="Clay">Clay</option>
                                    <option value="Clay Loam">Clay Loam</option>
                                    <option value="Loamy">Loamy</option>
                                    <option value="Sandy Loam">Sandy Loam</option>
                                    <option value="Black">Black</option>
                                    <option value="Laterite">Laterite</option>
                                </select>
                            </div>

                            <!-- Crop Context -->
                            <div class="form-group">
                                <label for="season">Season</label>
                                <select id="season" class="form-control" required>
                                    <option value="">Select Season...</option>
                                    <option value="Kharif">Kharif (June - Oct)</option>
                                    <option value="Rabi">Rabi (Oct - March)</option>
                                    <option value="Zaid">Zaid (March - June)</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="prevCrop">Previous Crop (Optional)</label>
                                <input type="text" id="prevCrop" class="form-control" placeholder="e.g. Wheat">
                            </div>
                        </div>

                        <div class="mt-1" style="text-align: right;">
                            <button type="submit" class="btn btn-primary" style="padding: 15px 40px; font-size: 1.1rem;">
                                Generate AI Recommendation ✨
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Results Section -->
                <h2 style="color: var(--primary-dark); display: none;" id="resultsTitle">Recommendation Results</h2>
                <div id="recommendationResults" class="recommendation-container" style="display: none;">
                    <!-- JS Injects Cards Here -->
                </div>

            </div>
        </main>
    </div>

    <!-- Load JS Engine -->
    <script src="js/cropData.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/cropRecommendation.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Reveal title when results are shown
        document.getElementById('cropRecommendationForm').addEventListener('submit', () => {
            setTimeout(() => {
                const results = document.getElementById('recommendationResults');
                if(results.style.display !== 'none') {
                    document.getElementById('resultsTitle').style.display = 'block';
                    document.getElementById('resultsTitle').classList.add('animate-fade-in');
                }
            }, 100);
        });
    </script>
</body>
</html>
