<!DOCTYPE html>
<!-- cspell:ignore Agri Zaid -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crop Recommendation - AgriTech</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" style="display: flex; flex-direction: column;">
            <div class="sidebar-header" style="text-align: left; padding-left: 20px; align-items: flex-start; padding-top: 20px; height: auto; border-bottom: none;">
                <h2 style="font-size: 1.5rem; line-height: 1.2;">Farmer Friendly<br>App</h2>
            </div>
            <nav class="sidebar-nav" style="flex: 1;">
                <a href="dashboard.html" class=""><span style="display: inline-block; width: 20px;">📊</span> Dashboard</a>
                <a href="crop-recommendation.html" class="active"><span style="display: inline-block; width: 20px;">🌱</span> Crop Recommendation</a>
                <a href="disease-detection.html" class=""><span style="display: inline-block; width: 20px;">🦠</span> Disease Detection</a>
                <a href="fertilizer-advisory.html" class=""><span style="display: inline-block; width: 20px;">🧪</span> Fertilizer Advisory</a>
                <a href="ai-chatbot.html" class=""><span style="display: inline-block; width: 20px;">🤖</span> AI Chatbot</a>
                <a href="weather.html" class=""><span style="display: inline-block; width: 20px;">☁️</span> Weather</a>
                
                <div style="padding: 15px 25px; margin-top: 10px;">
                    <div style="color: rgba(255,255,255,0.8); margin-bottom: 8px; font-weight: 500;">
                        <span style="display: inline-block; width: 20px;">🌍</span> Language
                    </div>
                    <select style="width: 100%; padding: 8px; border-radius: 4px; border: none; font-family: inherit; color: var(--text-main);">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                    </select>
                </div>
            </nav>
            <div style="padding: 15px; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.8);">
                <div>&copy; 2026</div>
            </div>
        </aside>

               <main class="main-content">
            

            <div class="page-content animate-fade-in">
                <h1 class="mb-2">Crop Recommendation</h1>
                
                <div class="card" style="max-width: 800px; padding: 30px;">
                    <form id="cropRecommendationForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        
                        <!-- Row 1 -->
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Nitrogen (N)</label>
                            <input type="number" id="n" required placeholder="e.g., 90" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Phosphorus (P)</label>
                            <input type="number" id="p" required placeholder="e.g., 42" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <!-- Row 2 -->
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Potassium (K)</label>
                            <input type="number" id="k" required placeholder="e.g., 43" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Soil pH</label>
                            <input type="number" step="0.1" id="ph" required placeholder="e.g., 6.5" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <!-- Row 3 -->
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Temperature (°C)</label>
                            <input type="number" step="0.1" id="temp" required placeholder="e.g., 25.5" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Humidity (%)</label>
                            <input type="number" step="0.1" id="humidity" required placeholder="e.g., 71" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <!-- Row 4 -->
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Rainfall (mm)</label>
                            <input type="number" step="0.1" id="rainfall" required placeholder="e.g., 100" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Season</label>
                            <select id="season" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: white;">
                                <option value="Kharif">Kharif</option>
                                <option value="Rabi">Rabi</option>
                                <option value="Zaid">Zaid</option>
                            </select>
                        </div>

                        <!-- Row 5 -->
                        <div style="display: flex; flex-direction: column; gap: 8px; grid-column: 1 / -1;">
                            <label style="font-weight: 600;">Soil Type</label>
                            <select id="soilType" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: white;">
                                <option value="Loamy">Loamy</option>
                                <option value="Clay">Clay</option>
                                <option value="Sandy">Sandy</option>
                            </select>
                        </div>

                        <button type="submit" class="btn" style="grid-column: 1 / -1; background-color: #2e7d32; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 1rem; margin-top: 10px;">Get Recommendation</button>
                    </form>
                </div>
                
                <h2 id="resultsTitle" style="display: none; margin-top: 40px; margin-bottom: 20px;">Top Recommendations</h2>
                <div id="recommendationResults" class="recommendation-container" style="display: none;"></div>
            </div>
        </main>
    </div>

    <!-- Load JS Engine -->
    <script src="js/cropData.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/cropRecommendation.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Reveal title when results are shown
        document.getElementById('cropRecommendationForm').addEventListener('submit', () => {
            setTimeout(() => {
                const results = document.getElementById('recommendationResults');
                if(results.style.display !== 'none') {
                    document.getElementById('resultsTitle').style.display = 'block';
                    document.getElementById('resultsTitle').classList.add('animate-fade-in');
                }
            }, 100);
        });
    </script>
</body>
</html>
