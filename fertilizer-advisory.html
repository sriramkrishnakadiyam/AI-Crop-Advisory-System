<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fertilizer Advisory - AI Crop Advisory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" style="display: flex; flex-direction: column;">
            <div class="sidebar-header" style="text-align: left; padding-left: 20px; align-items: flex-start; padding-top: 20px; height: auto; border-bottom: none;">
                <h2 style="font-size: 1.5rem; line-height: 1.2;">Farmer Friendly<br>App</h2>
            </div>
            <nav class="sidebar-nav" style="flex: 1;">
                <a href="dashboard.html" class=""><span style="display: inline-block; width: 20px;">📊</span> Dashboard</a>
                <a href="crop-recommendation.html" class=""><span style="display: inline-block; width: 20px;">🌱</span> Crop Recommendation</a>
                <a href="disease-detection.html" class=""><span style="display: inline-block; width: 20px;">🦠</span> Disease Detection</a>
                <a href="fertilizer-advisory.html" class="active"><span style="display: inline-block; width: 20px;">🧪</span> Fertilizer Advisory</a>
                <a href="ai-chatbot.html" class=""><span style="display: inline-block; width: 20px;">🤖</span> AI Chatbot</a>
                <a href="weather.html" class=""><span style="display: inline-block; width: 20px;">☁️</span> Weather</a>
                <a href="market-prices.html" class=""><span style="display: inline-block; width: 20px;">📈</span> Market Prices</a>
                
                <div style="padding: 15px 25px; margin-top: 10px;">
                    <div style="color: rgba(255,255,255,0.8); margin-bottom: 8px; font-weight: 500;">
                        <span style="display: inline-block; width: 20px;">🌍</span> Language
                    </div>
                    <select class="language-selector" aria-label="Select language" style="width: 100%; padding: 8px; border-radius: 4px; border: none; font-family: inherit; color: var(--text-main);">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                    </select>
                </div>
            </nav>
            <div style="padding: 15px; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.8);">
                <div>&copy; 2026</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            

            <div class="page-content animate-fade-in">
                <h1 class="mb-2">Fertilizer Advisory</h1>
                
                <div class="card" style="max-width: 800px; padding: 30px;">
                    <form id="fertilizerForm" style="display: flex; flex-direction: column; gap: 20px;">
                        
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Crop</label>
                            <input id="crop" type="text" list="cropOptions" required autocomplete="off"
                                placeholder="Type a crop name, e.g. Rice"
                                style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: white;">
                            <datalist id="cropOptions"></datalist>
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Nitrogen (N) kg/ha</label>
                            <input type="number" id="n" placeholder="e.g., 80" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Phosphorus (P) kg/ha</label>
                            <input type="number" id="p" placeholder="e.g., 40" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Potassium (K) kg/ha</label>
                            <input type="number" id="k" placeholder="e.g., 40" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Soil pH</label>
                            <input type="number" id="ph" step="0.1" placeholder="e.g., 6.5" style="padding: 10px; border: 1px solid #ddd; border-radius: 4px;">
                        </div>

                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <label style="font-weight: 600;">Soil Type</label>
                            <select style="padding: 10px; border: 1px solid #ddd; border-radius: 4px; background: white;">
                                <option>Loamy</option>
                                <option>Clay</option>
                                <option>Sandy</option>
                            </select>
                        </div>

                        <button type="submit" class="btn" style="background-color: #d89000; color: white; border: none; padding: 15px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 1rem; margin-top: 10px;">Get Advisory</button>
                    </form>
                </div>

                <div id="fertilizerResults" class="card" style="display: none; max-width: 800px; margin-top: 30px; padding: 30px;">
                    <h2 style="color: #d89000; margin-bottom: 20px;">Recommendation: <span id="fertCategory"></span></h2>
                    
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; text-align: center;">
                        <div style="padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd;">
                            <div style="font-size: 0.9rem; color: #666;">Nitrogen (N)</div>
                            <div id="nStatus" style="font-weight: bold; font-size: 1.2rem; margin-top: 5px;">-</div>
                        </div>
                        <div style="padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd;">
                            <div style="font-size: 0.9rem; color: #666;">Phosphorus (P)</div>
                            <div id="pStatus" style="font-weight: bold; font-size: 1.2rem; margin-top: 5px;">-</div>
                        </div>
                        <div style="padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd;">
                            <div style="font-size: 0.9rem; color: #666;">Potassium (K)</div>
                            <div id="kStatus" style="font-weight: bold; font-size: 1.2rem; margin-top: 5px;">-</div>
                        </div>
                    </div>
                    
                    <p id="advisoryMessage" style="font-size: 1.1rem; line-height: 1.6;"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/cropData.js"></script>
    <script src="js/main.js"></script>
    <script src="js/fertilizer.js"></script>
</body>
</html>
