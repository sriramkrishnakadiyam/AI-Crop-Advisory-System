<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - AI Crop Advisory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cards.css">
    <style>
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%       { opacity: 1;   transform: scale(1.3); }
        }
        #chatBox::-webkit-scrollbar { width: 6px; }
        #chatBox::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
        #chatBox::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" style="display: flex; flex-direction: column;">
            <div class="sidebar-header" style="text-align: left; padding-left: 20px; align-items: flex-start; padding-top: 20px; height: auto; border-bottom: none;">
                <h2 style="font-size: 1.5rem; line-height: 1.2;">Farmer Friendly<br>App</h2>
            </div>
            <nav class="sidebar-nav" style="flex: 1;">
                <a href="dashboard.html"><span style="display: inline-block; width: 20px;">📊</span> Dashboard</a>
                <a href="crop-recommendation.html"><span style="display: inline-block; width: 20px;">🌱</span> Crop Recommendation</a>
                <a href="disease-detection.html"><span style="display: inline-block; width: 20px;">🦠</span> Disease Detection</a>
                <a href="fertilizer-advisory.html"><span style="display: inline-block; width: 20px;">🧪</span> Fertilizer Advisory</a>
                <a href="ai-chatbot.html" class="active"><span style="display: inline-block; width: 20px;">🤖</span> AI Chatbot</a>
                <a href="weather.html"><span style="display: inline-block; width: 20px;">☁️</span> Weather</a>
                
                <div style="padding: 15px 25px; margin-top: 10px;">
                    <div style="color: rgba(255,255,255,0.8); margin-bottom: 8px; font-weight: 500;">
                        <span style="display: inline-block; width: 20px;">🌍</span> Language
                    </div>
                    <select style="width: 100%; padding: 8px; border-radius: 4px; border: none; font-family: inherit; color: var(--text-main);">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="te">Telugu</option>
                    </select>
                </div>
            </nav>
            <div style="padding: 15px; text-align: center; font-size: 0.75rem; color: rgba(255,255,255,0.8);">
                <div>&copy; 2026</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-content animate-fade-in">
                <h1 class="mb-2">AI Chatbot</h1>
                
                <div style="display: flex; flex-direction: column; gap: 20px; max-width: 800px;">
                    <!-- Chat messages area -->
                    <div id="chatBox" class="card" style="
                        height: 420px;
                        overflow-y: auto;
                        display: flex;
                        flex-direction: column;
                        padding: 20px;
                        background: #fafbff;
                        border: 1px solid #e8eaf6;
                    ">
                        <!-- Messages injected by JS -->
                    </div>
                    
                    <!-- Input area -->
                    <div class="card" style="padding: 20px;">
                        <label style="font-weight: 600; display: block; margin-bottom: 10px;">Ask your question</label>
                        <div style="display: flex; gap: 10px;">
                            <input
                                id="chatInput"
                                type="text"
                                placeholder="e.g. What fertilizer for rice? What disease affects wheat?"
                                style="flex: 1; padding: 12px 16px; border: 1.5px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; transition: border-color 0.2s;"
                                onfocus="this.style.borderColor='#2962ff'"
                                onblur="this.style.borderColor='#ddd'"
                            >
                            <button
                                id="askBtn"
                                style="background-color: #2962ff; color: white; border: none; padding: 12px 28px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; transition: background 0.2s; white-space: nowrap;"
                                onmouseover="this.style.background='#1a47cc'"
                                onmouseout="this.style.background='#2962ff'"
                            >Ask ➤</button>
                        </div>
                        <div style="margin-top: 10px; font-size: 0.8rem; color: #7f8c8d;">
                            💡 Try: "How to grow rice?", "NPK for wheat", "soil pH for cotton", "what causes blight?"
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
