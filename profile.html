<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - AI Crop Advisory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>AgriTech AI</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span>📊 Dashboard</span></a>
                <a href="crop-recommendation.html"><span>🌱 Crop Advisory</span></a>
                <a href="fertilizer-advisory.html"><span>🧪 Fertilizer</span></a>
                <a href="irrigation-advisory.html"><span>💧 Irrigation</span></a>
                <a href="crop-rotation.html"><span>🔄 Rotation</span></a>
                <a href="yield-prediction.html"><span>📈 Yield Prediction</span></a>
                <a href="history.html"><span>📜 History</span></a>
                <a href="profile.html" class="active"><span>👤 Profile</span></a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="navbar">
                <div class="nav-title" style="font-weight: 600; font-size: 1.2rem;">Farmer Profile</div>
                <div class="user-profile">
                    <span style="background: var(--primary-light); color: white; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; cursor:pointer;" id="logoutBtn">Logout</span>
                </div>
            </header>

            <div class="page-content animate-fade-in">
                <div class="form-card" style="max-width: 600px; margin: 0 auto;">
                    <h2 class="mb-2" style="color: var(--primary-dark);">Your Profile</h2>
                    
                    <div style="display: flex; flex-direction: column; gap: 15px;">
                        <div>
                            <label style="font-weight:bold; color:var(--text-muted);">Name</label>
                            <p id="profileName" style="font-size: 1.1rem;"></p>
                        </div>
                        <div>
                            <label style="font-weight:bold; color:var(--text-muted);">Email</label>
                            <p id="profileEmail" style="font-size: 1.1rem;"></p>
                        </div>
                        <div>
                            <label style="font-weight:bold; color:var(--text-muted);">State</label>
                            <p id="profileState" style="font-size: 1.1rem;"></p>
                        </div>
                        <div>
                            <label style="font-weight:bold; color:var(--text-muted);">District</label>
                            <p id="profileDistrict" style="font-size: 1.1rem;"></p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
