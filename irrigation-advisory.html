<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irrigation Advisory - AI Crop Advisory</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>AgriTech AI</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><span>📊 Dashboard</span></a>
                <a href="crop-recommendation.html"><span>🌱 Crop Advisory</span></a>
                <a href="fertilizer-advisory.html"><span>🧪 Fertilizer</span></a>
                <a href="irrigation-advisory.html" class="active"><span>💧 Irrigation</span></a>
                <a href="crop-rotation.html"><span>🔄 Rotation</span></a>
                <a href="yield-prediction.html"><span>📈 Yield Prediction</span></a>
                <a href="history.html"><span>📜 History</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="navbar">
                <div class="nav-title" style="font-weight: 600; font-size: 1.2rem;">Irrigation Priority Engine</div>
            </header>

            <div class="page-content animate-fade-in">
                <div class="form-card mb-2">
                    <h2 class="mb-1" style="color: var(--primary-dark);">Soil Moisture & Weather Inputs</h2>
                    
                    <form id="irrigationForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Crop</label>
                                <select id="irrCrop" class="form-control" required></select>
                            </div>
                            <div class="form-group">
                                <label>Soil Moisture (%)</label>
                                <input type="number" id="irrMoisture" class="form-control" placeholder="e.g. 15" required>
                            </div>
                            <div class="form-group">
                                <label>Temperature (°C)</label>
                                <input type="number" id="irrTemp" class="form-control" placeholder="e.g. 35" required>
                            </div>
                            <div class="form-group">
                                <label>Rainfall Forecast (mm)</label>
                                <input type="number" id="irrRain" class="form-control" placeholder="e.g. 0" required>
                            </div>
                            <div class="form-group">
                                <label>Growth Stage</label>
                                <select id="irrStage" class="form-control" required>
                                    <option value="Initial">Initial / Germination</option>
                                    <option value="Development">Crop Development</option>
                                    <option value="Mid">Mid-season / Flowering</option>
                                    <option value="Late">Late / Maturity</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-1" style="text-align: right;">
                            <button type="submit" class="btn btn-primary">Check Irrigation Need 💧</button>
                        </div>
                    </form>
                </div>

                <div id="irrigationResults" class="card" style="display: none;">
                    <h2 class="card-title">Irrigation Advisory</h2>
                    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 20px;">
                        <div id="irrPriorityBadge" style="padding: 15px 30px; border-radius: 30px; font-weight: bold; color: white; font-size: 1.2rem;"></div>
                        <h3 id="irrStatus" style="color: var(--text-main);"></h3>
                    </div>
                    <p id="irrMessage" style="color: var(--text-muted); line-height: 1.6;"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/cropData.js"></script>
    <script src="js/main.js"></script>
    <script src="js/irrigation.js"></script>
</body>
</html>
